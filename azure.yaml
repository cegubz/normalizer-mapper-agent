# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.8'
        azure.ai.projects: '>=1.0.0-beta.4'
name: normalizer-mapper-agent
metadata:
    template: normalizer-mapper-agent@1.0.0
services:
    aif-schemaupd-dev-aue-proj:
        host: azure.ai.project
        endpoint: https://aif-schemaupd-dev-aue-001.services.ai.azure.com/api/projects/aif-schemaupd-dev-aue-proj
    normalizer-mapper-agent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - aif-schemaupd-dev-aue-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            AZURE_STORAGE_ACCOUNT_URL : https://stschemaupddevaue001.blob.core.windows.net/
            STORAGE_BACKEND : azure_blob
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: foundry_app.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: normalizer-mapper-agent
        protocols:
            - protocol: responses
              version: 2.0.0
